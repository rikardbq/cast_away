[package]
name = "cast_away"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6.10"
actix-web = "4.12.1"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.18"
futures = "0.3.32"
winit = "0.30.12"
wry = "0.55.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fcast-sender-sdk = { version = "0.1.3", default-features = false, features = [
    "chromecast",
    "logging",
    "discovery",
] }
infer = "0.19.0"
rfd = "0.17.2"
local-ip-address = "0.6.13"
ffmpeg-sidecar = "2.5.1"
rust_cast = "0.21.0"
mdns-sd = "0.20.0"

[build-dependencies]
ffmpeg-sidecar = "2.5.1"
